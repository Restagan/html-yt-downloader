<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Downloader | Futuristic YT Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1a1b2e, var(--bg));
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Dekorasi Background */
        body::before {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            background: var(--secondary);
            filter: blur(150px);
            top: -50px; left: -50px;
            z-index: -1;
            opacity: 0.3;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }

        .btn-search {
            background: linear-gradient(45deg, var(--secondary), #4b00ab);
            color: white;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(112, 0, 255, 0.3);
        }

        /* Result Area */
        .result-box {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .thumb-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .thumb-wrapper img {
            width: 100%;
            display: block;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 10px 0 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .download-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-download {
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-download:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }

        .btn-download i { font-size: 1.2rem; }

        /* Loading State */
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        button:disabled { opacity: 0.6; cursor: not-allowed; }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-card">
        <h1>X-DOWNLOADER</h1>
        <p class="subtitle">Unduh video & audio favoritmu secara instan.</p>

        <div class="input-group">
            <input type="text" id="ytUrl" placeholder="Tempel link YouTube di sini...">
        </div>

        <button id="btnCheck" class="btn-search" onclick="cekVideo()">
            <span id="btnText">TEMUKAN VIDEO</span>
            <div id="loader" class="loader"></div>
        </button>

        <div id="resultBox" class="result-box">
            <div class="thumb-wrapper">
                <img id="thumb" src="" alt="Thumbnail">
            </div>
            <div class="video-title" id="title">Judul Video</div>
            <div class="video-meta" id="meta">Channel Name</div>
            
            <div class="download-options">
                <button class="btn-download" id="btnMp4" onclick="downloadMedia('video')">
                    <i class="fa-solid fa-video"></i> MP4
                </button>
                <button class="btn-download" id="btnMp3" onclick="downloadMedia('audio')">
                    <i class="fa-solid fa-music"></i> MP3
                </button>
            </div>
        </div>
    </div>
    
    <footer>
        &copy; 2024 Powered by <b>Restagan</b> Space
    </footer>
</div>

<script>
    // URL Backend Hugging Face Space kamu
    const BACKEND_URL = "https://restagan-youtube-downloader.hf.space";
    let currentUrl = "";

    async function cekVideo() {
        const url = document.getElementById("ytUrl").value;
        if (!url) return alert("Masukkan URL YouTube!");

        const btnCheck = document.getElementById("btnCheck");
        const btnText = document.getElementById("btnText");
        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("resultBox");

        // UI Loading
        btnCheck.disabled = true;
        btnText.style.display = "none";
        loader.style.display = "block";
        resultBox.style.display = "none";

        try {
            const response = await fetch(`${BACKEND_URL}/api/info`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: url })
            });
            
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || data.error || "Gagal mengambil data");

            currentUrl = url;
            document.getElementById("thumb").src = data.thumbnail;
            document.getElementById("title").innerText = data.judul;
            document.getElementById("meta").innerText = `${data.channel} • ${Math.floor(data.durasi / 60)} menit`;
            
            resultBox.style.display = "block";
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btnCheck.disabled = false;
            btnText.style.display = "block";
            loader.style.display = "none";
        }
    }

    async function downloadMedia(tipe) {
        const btnMp4 = document.getElementById("btnMp4");
        const btnMp3 = document.getElementById("btnMp3");
        
        const originalMp4 = btnMp4.innerHTML;
        const originalMp3 = btnMp3.innerHTML;

        btnMp4.disabled = true;
        btnMp3.disabled = true;
        
        if(tipe === 'video') btnMp4.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        else btnMp3.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

        try {
            const response = await fetch(`${BACKEND_URL}/api/download`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: currentUrl, tipe: tipe })
            });

            if (!response.ok) throw new Error("Gagal mengunduh file.");

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = downloadUrl;
            
            // Mengambil nama file dari header jika ada
            const contentDisposition = response.headers.get('Content-Disposition');
            let filename = tipe === 'audio' ? 'audio.mp3' : 'video.mp4';
            
            if (contentDisposition && contentDisposition.includes('filename=')) {
                filename = contentDisposition.split('filename=')[1].replace(/"/g, '');
            }
            
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(downloadUrl);
            a.remove();
        } catch (error) {
            alert(error.message);
        } finally {
            btnMp4.disabled = false;
            btnMp3.disabled = false;
            btnMp4.innerHTML = originalMp4;
            btnMp3.innerHTML = originalMp3;
        }
    }
</script>

</body>
</html>
